name: regulatory-intelligence

services:
  api:
    build:
      context: .
      target: runtime
    environment:
      RIA_APP_NAME: ${RIA_APP_NAME:-Regulatory Intelligence Assistant}
      RIA_ENVIRONMENT: ${RIA_ENVIRONMENT:-development}
      RIA_LOG_LEVEL: ${RIA_LOG_LEVEL:-INFO}
      RIA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-regulatory}:${POSTGRES_PASSWORD:-regulatory}@postgres:5432/${POSTGRES_DB:-regulatory}
      RIA_MINIMUM_QUERY_COVERAGE: ${RIA_MINIMUM_QUERY_COVERAGE:-0.60}
      RIA_MAX_RESULTS: ${RIA_MAX_RESULTS:-5}
      RIA_AUTO_CREATE_SCHEMA: "true"
      RIA_METRICS_REPORT: /srv/app/artifacts/evaluation-report-v2.json
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regulatory}
      POSTGRES_USER: ${POSTGRES_USER:-regulatory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regulatory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:9090/-/healthy
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
